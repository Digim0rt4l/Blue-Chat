<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-visual"
    />
    <meta name="referrer" content="no-referrer" />
    <title>Blue Chat</title>
    <style>
      :root {
        --bg: #0f1115;
        --panel: #161a22;
        --bubble: #2a3b5f;
        --accent: #4a90e2;
        --accent-red: #d9534f;
        --text: #e6eaf0;
        --muted: #9aa4b2;
        --mine: #215d9a;
        --success: #2d9962;
      }

      * {
        box-sizing: border-box;
      }

      button,
      input,
      textarea,
      select {
        font-family: inherit;
      }

      html,
      body {
        height: 100%;
        overflow: hidden;
        overscroll-behavior: none;
        -webkit-text-size-adjust: 100%;
        text-size-adjust: 100%;
      }

      *,
      *::before,
      *::after {
        touch-action: pan-x pan-y;
      }

      input,
      textarea,
      select {
        font-size: max(16px, 1em);
      }

      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "DejaVu Sans Mono", "Liberation Mono",
          "Courier New", Courier, monospace;
        font-size: 16px;
        position: fixed;
        inset: 0;
      }

      .app {
        position: fixed;
        top: 2.5vh;
        left: 2.5vw;
        width: 95vw;
        height: 95vh;
        display: grid;
        grid-template-columns: 280px 1fr;
        gap: 10px;
      }

      .panel {
        background: var(--panel);
        border-radius: 12px;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        min-width: 0;
      }

      .header {
        flex: none;
        height: 54px;
        padding: 0 12px;
        border-bottom: 1px solid #222832;
        display: flex;
        flex-wrap: nowrap;
        gap: 10px;
        align-items: center;
        white-space: nowrap;
        overflow: hidden;
      }

      .header > * {
        flex-shrink: 0;
      }

      .brand {
        font-weight: 800;
      }

      .pill {
        padding: 4px 10px;
        border-radius: 999px;
        background: #283143;
        font-size: 12px;
        font-weight: 700;
      }

      .status.connected {
        background: var(--accent);
        color: #fff;
      }

      .status.disconnected {
        background: var(--accent-red);
        color: #fff;
      }

      .spacer {
        flex: 1 1 0;
        min-width: 0;
      }

      .btn {
        cursor: pointer;
        user-select: none;
        padding: 6px 10px;
        border-radius: 8px;
        border: 1px solid #2b3446;
        background: #0f1218;
        color: var(--text);
        font-size: 16px;
      }

      .btn:active {
        transform: translateY(1px);
      }

      .people {
        padding: 10px;
        border-bottom: 1px solid #222832;
        display: grid;
        grid-template-columns: 1fr auto auto;
        gap: 8px;
        align-items: center;
      }

      .people input[type="text"] {
        width: 100%;
        background: #0f1218;
        border: 1px solid #283143;
        color: var(--text);
        padding: 8px 10px;
        border-radius: 8px;
        outline: none;
        font-size: 16px;
      }

      .people input[type="color"] {
        width: 30px;
        height: 30px;
        border-radius: 50%;
        border: 2px solid #00000033;
        padding: 0;
        appearance: none;
        -webkit-appearance: none;
        outline: none;
      }

      .people input[type="color"]::-webkit-color-swatch-wrapper {
        padding: 0;
        border-radius: 50%;
      }

      .people input[type="color"]::-webkit-color-swatch {
        border: none;
        border-radius: 50%;
      }

      .list {
        flex: 1;
        min-height: 0;
        overflow: auto;
        padding: 8px;
      }

      .brandmark {
        flex: none;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 4px;
        padding: 12px 8px 14px;
        border-top: 1px solid #222832;
      }

      .brandmark img {
        display: block;
        width: 56px;
        height: 56px;
      }

      .version {
        font-size: 12px;
        color: var(--muted);
        min-height: 1em;
      }

      .person {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 8px;
        border-radius: 8px;
        min-width: 0;
      }

      .person-name {
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: #3b475c;
      }

      .dot.online {
        background: var(--success);
      }

      .chip {
        width: 14px;
        height: 14px;
        border-radius: 50%;
        border: 1px solid #00000033;
      }

      .typing {
        font-size: 12px;
        color: var(--muted);
        margin-left: auto;
      }

      .main {
        display: grid;
        grid-template-rows: auto minmax(0, 1fr) auto;
        grid-template-columns: minmax(280px, 1fr);
        min-width: 0;
      }

      .feed {
        overflow: auto;
        overflow-x: hidden;
        padding: 12px;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      .row {
        display: flex;
        width: 100%;
      }

      .row.mine {
        justify-content: flex-end;
      }

      .msg {
        max-width: 85%;
        padding: 10px 12px;
        border-radius: 12px;
        background: var(--bubble);
        color: var(--text);
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        word-break: break-word;
      }

      .msg.mine {
        background: var(--mine);
      }

      .meta {
        font-size: 11px;
        color: var(--muted);
        margin-top: 6px;
        display: flex;
        gap: 8px;
        align-items: center;
      }

      .name {
        font-weight: 600;
      }

      .receipt {
        white-space: nowrap;
      }

      .receipt.seen {
        color: #c9d6ee;
      }

      .receipt.all {
        color: #8fc4ff;
      }

      .typingbar {
        font-size: 12px;
        color: var(--muted);
        padding: 0 14px 6px;
        min-height: 18px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .dots {
        display: inline-flex;
        gap: 2px;
        margin-left: 4px;
        vertical-align: middle;
      }

      .dots span {
        width: 4px;
        height: 4px;
        border-radius: 50%;
        background: currentColor;
        animation: typing-dot 1.2s infinite ease-in-out;
      }

      .dots span:nth-child(2) {
        animation-delay: 0.15s;
      }

      .dots span:nth-child(3) {
        animation-delay: 0.3s;
      }

      @keyframes typing-dot {
        0%,
        60%,
        100% {
          opacity: 0.3;
          transform: translateY(0);
        }

        30% {
          opacity: 1;
          transform: translateY(-2px);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .dots span {
          animation: none;
          opacity: 0.7;
        }
      }

      .input {
        display: flex;
        align-items: flex-end;
        gap: 8px;
        padding: 12px;
        border-top: 1px solid #222832;
      }

      .input textarea {
        resize: none;
        height: 44px;
        min-height: 44px;
        max-height: 132px;
        line-height: 22px;
        overflow-y: hidden;
        flex: 1;
        border-radius: 10px;
        border: 1px solid #283143;
        background: #0f1218;
        color: #e6eaf0;
        padding: 10px 12px;
        outline: none;
        font-size: 16px;
      }

      .input button {
        height: 44px;
        flex: none;
        padding: 0 18px;
        border: none;
        border-radius: 10px;
        background: #4a90e2;
        color: #fff;
        font-weight: 600;
        cursor: pointer;
        font-size: 16px;
      }

      .sys {
        width: 100%;
        font-size: 12px;
        color: var(--muted);
        padding: 8px 12px;
        border: 1px dashed #3b475c;
        border-radius: 8px;
        margin: 6px 0;
        display: flex;
        align-items: baseline;
        text-align: left;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        word-break: break-word;
      }

      .sys-text {
        flex: 1 1 auto;
        min-width: 0;
      }

      .sys.alert {
        color: #f0ad4e;
        border-color: #6b5426;
      }

      .sys.idle {
        color: #7f93b5;
        border-color: #2f3a52;
      }

      .sys.back {
        color: #5cb88a;
        border-color: #2b5a43;
      }

      .swatch {
        display: inline-block;
        width: 0.85em;
        height: 0.85em;
        border-radius: 50%;
        margin-left: 0.45em;
        vertical-align: -0.1em;
        border: 1px solid #ffffff33;
      }

      .sys-time {
        flex: none;
        opacity: 0.75;
        white-space: pre;
      }

      .app.hide-contacts {
        grid-template-columns: 1fr;
      }

      .app.hide-contacts .panel.sidebar {
        display: none;
      }

      @media (max-width: 860px) {
        .app {
          width: 100%;
          height: 100%;
          border-radius: 0;
        }
      }

      @media (max-width: 600px) {
        .app:not(.hide-contacts) .input textarea,
        .app:not(.hide-contacts) .input textarea::placeholder {
          white-space: pre;
          overflow-wrap: normal;
          word-break: normal;
        }

        .app:not(.hide-contacts) .input textarea {
          overflow-x: hidden;
        }
      }

      @media (max-width: 430px) {
        .header {
          gap: 8px;
          padding: 0 10px;
        }

        .header .btn {
          padding: 6px 8px;
        }
      }

      @media (max-width: 359px) {
        .wide-only {
          display: none;
        }

        .header {
          gap: 6px;
        }

        .header .btn {
          padding: 6px 6px;
        }

        .header .pill {
          padding: 4px 8px;
        }
      }
    </style>
  </head>
  <body>
    <div class="app" id="app">
      <div class="panel sidebar">
        <div class="header">
          <div class="spacer"></div>
          <button class="btn" id="toggle-contacts" type="button" title="Hide">Hide</button>
        </div>
        <div class="people">
          <input
            id="name"
            type="text"
            placeholder="Your username"
            maxlength="32"
            aria-label="Your username"
          />
          <input id="color" type="color" aria-label="Your colour" />
          <button class="btn" id="apply-name" type="button">Apply</button>
        </div>
        <div class="list" id="user-list" aria-label="People online"></div>
        <div class="brandmark">
          <img id="icon" src="/icon.svg" alt="Blue Chat" width="56" height="56" />
          <div class="version" id="version"></div>
          <div class="version" id="security" title="Compare this with the code in the host's Server log"></div>
        </div>
      </div>
      <div class="panel main">
        <div class="header">
          <div class="brand">Blue Chat</div>
          <div class="pill status" id="status" role="status">Checking…</div>
          <div class="spacer"></div>
          <button class="btn" id="toggle-contacts-main" type="button" title="Show contacts">
            <span class="wide-only">Show </span>Contacts
          </button>
        </div>
        <div class="feed" id="feed" role="log" aria-live="polite"></div>
        <div class="typingbar" id="typingbar"></div>
        <div class="input">
          <textarea
            id="input"
            rows="1"
            placeholder="Type a message…"
            maxlength="1000"
            aria-label="Message"
          ></textarea>
          <button id="send" type="button">Send</button>
        </div>
      </div>
    </div>

    <script>
      (() => {
        "use strict";

        const DEFAULT_COLOR = "#4a90e2";
        const HEX_COLOR = /^#[0-9a-f]{6}$/i;
        const HEALTH_INTERVAL = 1000;
        const RECONNECT_DELAY = 1200;
        const TYPING_IDLE = 1200;
        const TYPING_REFRESH = 1000;
        const TYPING_EXPIRY = 4000;
        const FEED_LIMIT = 1000;
        const STICK_DISTANCE = 80;
        const READ_DELAY = 400;
        const READ_SHARE = 0.6;
        const INPUT_MIN_HEIGHT = 44;
        const PROTOCOL_VERSION = 1;
        const KEX_NONCE_BYTES = 32;
        const MLKEM_EK_BYTES = 1184;
        const PAD_BLOCK = 256;
        const crypto = window.BlueCrypto;
        const encoder = new TextEncoder();
        const decoder = new TextDecoder("utf-8", { fatal: true });
        const KEX_LABEL = encoder.encode("BlueChat key exchange v1");
        const KEY_INFO = encoder.encode("BlueChat session keys v1");
        const AAD_CLIENT = encoder.encode("BlueChat client to server v1");
        const AAD_SERVER = encoder.encode("BlueChat server to client v1");
        const ZOOM_KEYS = new Set(["+", "=", "-", "_", "0"]);
        const KIND_CLASSES = {
          kick: "alert",
          ban: "alert",
          shutdown: "alert",
          away: "idle",
          timeout: "idle",
          back: "back",
        };

        const storage = {
          get(key) {
            try {
              return window.localStorage.getItem(key);
            } catch {
              return null;
            }
          },
          set(key, value) {
            try {
              window.localStorage.setItem(key, value);
            } catch {}
          },
        };

        const els = {
          app: document.getElementById("app"),
          name: document.getElementById("name"),
          color: document.getElementById("color"),
          apply: document.getElementById("apply-name"),
          userList: document.getElementById("user-list"),
          feed: document.getElementById("feed"),
          input: document.getElementById("input"),
          send: document.getElementById("send"),
          status: document.getElementById("status"),
          typingbar: document.getElementById("typingbar"),
          toggleContacts: document.getElementById("toggle-contacts"),
          toggleContactsMain: document.getElementById("toggle-contacts-main"),
          version: document.getElementById("version"),
          security: document.getElementById("security"),
          icon: document.getElementById("icon"),
        };

        const state = {
          uid: loadUid(),
          selfId: null,
          users: new Map(),
          typing: new Map(),
          seenEvents: new Set(),
          ws: null,
          cfg: null,
          healthOk: false,
          healthBusy: false,
          connecting: false,
          settled: false,
          pinned: true,
          reconnectTimer: null,
          typingSent: 0,
          typingTimer: null,
          reads: new Map(),
          ownMessages: new Map(),
          visibleSeqs: new Set(),
          readSent: 0,
          readTimer: null,
          readObserver: null,
          channel: null,
        };

        function loadUid() {
          const saved = storage.get("uid");
          if (saved && /^[\w-]{8,64}$/.test(saved)) {
            return saved;
          }
          let fresh;
          if (window.crypto && typeof window.crypto.randomUUID === "function") {
            fresh = window.crypto.randomUUID();
          } else if (window.crypto && typeof window.crypto.getRandomValues === "function") {
            fresh = Array.from(window.crypto.getRandomValues(new Uint8Array(16)), (byte) =>
              byte.toString(16).padStart(2, "0"),
            ).join("");
          } else {
            fresh = `${Date.now().toString(16)}${Math.random().toString(16).slice(2)}`;
          }
          storage.set("uid", fresh);
          return fresh;
        }

        function safeColor(value) {
          return typeof value === "string" && HEX_COLOR.test(value) ? value : DEFAULT_COLOR;
        }

        function concatBytes(...parts) {
          const total = parts.reduce((sum, part) => sum + part.length, 0);
          const joined = new Uint8Array(total);
          let offset = 0;
          for (const part of parts) {
            joined.set(part, offset);
            offset += part.length;
          }
          return joined;
        }

        function toBase64(bytes) {
          let text = "";
          for (const byte of bytes) {
            text += String.fromCharCode(byte);
          }
          return btoa(text);
        }

        function fromBase64(value, size) {
          if (typeof value !== "string") {
            throw new Error("missing key exchange field");
          }
          const text = atob(value);
          if (text.length !== size) {
            throw new Error("key exchange field has the wrong length");
          }
          return Uint8Array.from(text, (character) => character.charCodeAt(0));
        }

        function counterBytes(counter) {
          const bytes = new Uint8Array(8);
          const view = new DataView(bytes.buffer);
          view.setUint32(0, Math.floor(counter / 4294967296));
          view.setUint32(4, counter >>> 0);
          return bytes;
        }

        function readCounter(bytes) {
          const view = new DataView(bytes.buffer, bytes.byteOffset, 8);
          return view.getUint32(0) * 4294967296 + view.getUint32(4);
        }

        function securityCode(material) {
          let number = 0n;
          for (const byte of material) {
            number = (number << 8n) | BigInt(byte);
          }
          const digits = String(number % 100000000n).padStart(8, "0");
          return `${digits.slice(0, 4)} ${digits.slice(4)}`;
        }

        function startChannel(offer) {
          if (!offer || offer.type !== "kex" || offer.v !== PROTOCOL_VERSION) {
            throw new Error("unexpected key exchange");
          }
          const serverDh = fromBase64(offer.x25519, 32);
          const serverKem = fromBase64(offer.mlkem, MLKEM_EK_BYTES);
          const serverNonce = fromBase64(offer.nonce, KEX_NONCE_BYTES);

          const secretKey = crypto.x25519.utils.randomSecretKey();
          const publicKey = crypto.x25519.getPublicKey(secretKey);
          const dh = crypto.x25519.getSharedSecret(secretKey, serverDh);
          if (dh.every((byte) => byte === 0)) {
            throw new Error("weak key exchange");
          }
          const { cipherText, sharedSecret } = crypto.ml_kem768.encapsulate(serverKem);
          const nonce = crypto.randomBytes(KEX_NONCE_BYTES);
          const transcript = crypto.sha256(
            concatBytes(KEX_LABEL, serverDh, serverKem, serverNonce, publicKey, cipherText, nonce),
          );
          const material = crypto.hkdf(crypto.sha256, concatBytes(sharedSecret, dh), transcript, KEY_INFO, 72);

          return {
            channel: {
              txKey: material.slice(0, 32),
              rxKey: material.slice(32, 64),
              tx: 0,
              rx: 0,
              code: securityCode(material.slice(64, 72)),
            },
            reply: {
              type: "kex",
              v: PROTOCOL_VERSION,
              x25519: toBase64(publicKey),
              mlkem: toBase64(cipherText),
              nonce: toBase64(nonce),
            },
          };
        }

        function seal(channel, payload) {
          const json = encoder.encode(JSON.stringify(payload));
          const padded = new Uint8Array(json.length + ((PAD_BLOCK - (json.length % PAD_BLOCK)) % PAD_BLOCK)).fill(32);
          padded.set(json);
          const header = counterBytes(channel.tx);
          channel.tx += 1;
          const sealed = crypto
            .chacha20poly1305(channel.txKey, concatBytes(new Uint8Array(4), header), AAD_CLIENT)
            .encrypt(padded);
          return concatBytes(header, sealed);
        }

        function unseal(channel, buffer) {
          const bytes = new Uint8Array(buffer);
          if (bytes.length < 24) {
            throw new Error("message is too short");
          }
          const header = bytes.slice(0, 8);
          if (readCounter(header) !== channel.rx) {
            throw new Error("message is out of order or replayed");
          }
          const plain = crypto
            .chacha20poly1305(channel.rxKey, concatBytes(new Uint8Array(4), header), AAD_SERVER)
            .decrypt(bytes.slice(8));
          channel.rx += 1;
          return JSON.parse(decoder.decode(plain));
        }

        function socketOpen() {
          return state.ws !== null && state.ws.readyState === WebSocket.OPEN && state.channel !== null;
        }

        function send(payload) {
          if (!socketOpen()) {
            return false;
          }
          try {
            state.ws.send(seal(state.channel, payload));
            return true;
          } catch {
            return false;
          }
        }

        function updateStatus() {
          const connected = state.healthOk && socketOpen();
          if (connected) {
            state.settled = true;
          }
          const checking = !state.settled && state.healthOk;
          els.status.textContent = connected ? "Connected" : checking ? "Checking…" : "Disconnected";
          els.status.classList.toggle("connected", connected);
          els.status.classList.toggle("disconnected", !connected && !checking);
        }

        function eventKey(event) {
          if (!event.ts) {
            return null;
          }
          return [event.type, event.ts, event.user_id || "", event.kind || "", event.msg || event.text || ""].join(
            "\u0000",
          );
        }

        function timeLabel(stamp) {
          const date = new Date(stamp || Date.now());
          return Number.isNaN(date.getTime()) ? new Date() : date;
        }

        function buildSystemRow(event) {
          const note = document.createElement("div");
          const kindClass = KIND_CLASSES[event.kind];
          note.className = kindClass ? `sys ${kindClass}` : "sys";

          const time = document.createElement("span");
          time.className = "sys-time";
          time.textContent = `${timeLabel(event.ts).toLocaleTimeString([], {
            hour: "2-digit",
            minute: "2-digit",
            second: "2-digit",
          })} · `;
          const text = document.createElement("span");
          text.className = "sys-text";
          text.textContent = event.msg || "system";
          note.append(time, text);

          if (typeof event.color === "string" && HEX_COLOR.test(event.color)) {
            const swatch = document.createElement("span");
            swatch.className = "swatch";
            swatch.style.background = event.color;
            swatch.title = event.color;
            text.append(swatch);
          }
          return note;
        }

        function buildMessage(event, mine) {
          const bubble = document.createElement("div");
          bubble.className = mine ? "msg mine" : "msg";

          const name = document.createElement("div");
          name.className = "name";
          name.textContent = event.username || "Guest";
          name.style.color = safeColor(event.color);

          const text = document.createElement("div");
          text.textContent = event.text || "";

          const meta = document.createElement("div");
          meta.className = "meta";
          const time = document.createElement("span");
          time.textContent = timeLabel(event.ts).toLocaleString();
          meta.append(time);

          if (mine && Number.isInteger(event.seq)) {
            const receipt = document.createElement("span");
            receipt.className = "receipt";
            meta.append(receipt);
            state.ownMessages.set(event.seq, receipt);
          }

          bubble.append(name, text, meta);
          return bubble;
        }

        function nameOf(id) {
          return state.users.get(id)?.username || state.reads.get(id)?.username || "Guest";
        }

        function describeReaders(readers, everyone) {
          if (readers.length === 0) {
            return "Sent";
          }
          if (everyone && readers.length > 2) {
            return "Seen by everyone";
          }
          const names = readers.map(nameOf);
          if (names.length === 1) {
            return `Seen by ${names[0]}`;
          }
          if (names.length === 2) {
            return `Seen by ${names[0]} and ${names[1]}`;
          }
          const others = names.length - 2;
          return `Seen by ${names[0]}, ${names[1]} and ${others} other${others === 1 ? "" : "s"}`;
        }

        function updateReceipts() {
          const online = Array.from(state.users.keys()).filter((id) => id !== state.selfId);
          const seqs = Array.from(state.ownMessages.keys()).sort((a, b) => a - b);
          const latest = seqs[seqs.length - 1];

          for (const seq of seqs) {
            const receipt = state.ownMessages.get(seq);
            if (!receipt.isConnected) {
              state.ownMessages.delete(seq);
              continue;
            }
            const readers = [];
            for (const [id, position] of state.reads) {
              if (id !== state.selfId && position.seq >= seq) {
                readers.push(id);
              }
            }
            readers.sort((a, b) => nameOf(a).localeCompare(nameOf(b)));
            const everyone = online.length > 0 && online.every((id) => readers.includes(id));
            receipt.classList.toggle("seen", readers.length > 0 && !everyone);
            receipt.classList.toggle("all", everyone);
            const ticks = readers.length > 0 ? "✓✓" : "✓";
            receipt.textContent = seq === latest ? `${ticks} ${describeReaders(readers, everyone)}` : ticks;
            receipt.title = describeReaders(readers, everyone);
          }
        }

        function watchForReading(row, seq) {
          row.dataset.seq = String(seq);
          if (state.readObserver) {
            state.readObserver.observe(row);
          } else {
            state.visibleSeqs.add(seq);
            scheduleRead();
          }
        }

        function scheduleRead() {
          if (state.readTimer !== null || document.visibilityState !== "visible") {
            return;
          }
          state.readTimer = setTimeout(() => {
            state.readTimer = null;
            if (document.visibilityState !== "visible" || state.visibleSeqs.size === 0) {
              return;
            }
            const newest = Math.max(...state.visibleSeqs);
            if (newest > state.readSent && send({ type: "read", user_id: state.uid, seq: newest })) {
              state.readSent = newest;
            }
          }, READ_DELAY);
        }

        function createReadObserver() {
          if (typeof IntersectionObserver !== "function") {
            return null;
          }
          return new IntersectionObserver(
            (entries) => {
              for (const entry of entries) {
                const seq = Number(entry.target.dataset.seq);
                const rootHeight = entry.rootBounds ? entry.rootBounds.height : window.innerHeight;
                const needed = Math.min(entry.boundingClientRect.height, rootHeight) * READ_SHARE;
                if (entry.isIntersecting && entry.intersectionRect.height >= needed) {
                  state.visibleSeqs.add(seq);
                } else {
                  state.visibleSeqs.delete(seq);
                }
              }
              scheduleRead();
            },
            { root: els.feed, threshold: [0, 0.25, 0.5, 0.6, 0.75, 1] },
          );
        }

        function addMessage(event) {
          const key = eventKey(event);
          if (key !== null) {
            if (state.seenEvents.has(key)) {
              return;
            }
            state.seenEvents.add(key);
          }

          const feed = els.feed;
          const mine = event.type !== "system" && state.selfId !== null && event.user_id === state.selfId;

          const row = document.createElement("div");
          row.className = mine ? "row mine" : "row";
          row.append(event.type === "system" ? buildSystemRow(event) : buildMessage(event, mine));
          feed.append(row);

          if (event.type === "message") {
            if (state.typing.delete(event.user_id)) {
              renderPeople();
            }
            if (!mine && Number.isInteger(event.seq)) {
              watchForReading(row, event.seq);
            }
            if (mine) {
              updateReceipts();
            }
          }

          while (feed.childElementCount > FEED_LIMIT) {
            const oldest = feed.firstElementChild;
            if (state.readObserver) {
              state.readObserver.unobserve(oldest);
            }
            oldest.remove();
          }
          if (state.seenEvents.size > FEED_LIMIT * 4) {
            state.seenEvents = new Set(Array.from(state.seenEvents).slice(-FEED_LIMIT * 2));
          }
          if (state.pinned || mine) {
            pinFeed();
          }
        }

        function pinFeed() {
          els.feed.scrollTop = els.feed.scrollHeight;
          state.pinned = true;
        }

        function watchFeed() {
          els.feed.addEventListener(
            "scroll",
            () => {
              const feed = els.feed;
              state.pinned = feed.scrollHeight - feed.scrollTop - feed.clientHeight <= STICK_DISTANCE;
            },
            { passive: true },
          );
          if (typeof ResizeObserver === "function") {
            new ResizeObserver(() => {
              if (state.pinned) {
                pinFeed();
              }
            }).observe(els.feed);
            let inputWidth = 0;
            new ResizeObserver((entries) => {
              const width = Math.round(entries[0].contentRect.width);
              if (width !== inputWidth) {
                inputWidth = width;
                fitInput();
              }
            }).observe(els.input);
          }
        }

        function renderUsers() {
          const entries = Array.from(state.users.entries()).sort((a, b) =>
            (a[1].username || "").localeCompare(b[1].username || ""),
          );
          const fragment = document.createDocumentFragment();

          for (const [id, user] of entries) {
            const person = document.createElement("div");
            person.className = "person";

            const dot = document.createElement("div");
            dot.className = "dot online";

            const chip = document.createElement("div");
            chip.className = "chip";
            chip.style.background = safeColor(user.color);

            const name = document.createElement("div");
            name.className = "person-name";
            name.textContent = user.username || "Guest";

            const typing = document.createElement("div");
            typing.className = "typing";
            typing.textContent = state.typing.has(id) ? "typing…" : "";

            person.append(dot, chip, name, typing);
            fragment.append(person);
          }

          els.userList.replaceChildren(fragment);
        }

        function expireTyping() {
          const now = Date.now();
          let changed = false;
          for (const [id, expires] of state.typing) {
            if (expires <= now) {
              state.typing.delete(id);
              changed = true;
            }
          }
          return changed;
        }

        function renderTyping() {
          expireTyping();
          const names = Array.from(state.typing.keys())
            .filter((id) => id !== state.selfId)
            .map((id) => state.users.get(id)?.username)
            .filter(Boolean)
            .sort((a, b) => a.localeCompare(b));

          if (names.length === 0) {
            els.typingbar.replaceChildren();
            return;
          }
          let label;
          if (names.length === 1) {
            label = `${names[0]} is typing`;
          } else if (names.length === 2) {
            label = `${names[0]} and ${names[1]} are typing`;
          } else {
            const others = names.length - 2;
            label = `${names[0]}, ${names[1]} and ${others} other${others === 1 ? "" : "s"} are typing`;
          }
          const text = document.createElement("span");
          text.textContent = label;
          const dots = document.createElement("span");
          dots.className = "dots";
          dots.setAttribute("aria-hidden", "true");
          dots.append(document.createElement("span"), document.createElement("span"), document.createElement("span"));
          els.typingbar.replaceChildren(text, dots);
        }

        function renderPeople() {
          renderTyping();
          renderUsers();
        }

        function handleEvent(event) {
          switch (event.type) {
            case "welcome":
              if (typeof event.user_id === "string") {
                state.selfId = event.user_id;
              }
              break;
            case "message":
            case "system":
              addMessage(event);
              break;
            case "presence":
              if (event.event === "online") {
                if (!state.users.has(event.user_id)) {
                  state.users.set(event.user_id, { username: event.username, color: event.color });
                }
              } else if (event.event === "offline") {
                state.users.delete(event.user_id);
                state.typing.delete(event.user_id);
              }
              renderPeople();
              updateReceipts();
              break;
            case "typing":
              if (event.typing) {
                state.typing.set(event.user_id, Date.now() + TYPING_EXPIRY);
              } else {
                state.typing.delete(event.user_id);
              }
              renderPeople();
              break;
            case "identity":
              state.users.set(event.user_id, { username: event.username, color: event.color });
              renderPeople();
              updateReceipts();
              break;
            case "read":
              if (typeof event.user_id === "string" && Number.isInteger(event.seq)) {
                const previous = state.reads.get(event.user_id);
                if (!previous || previous.seq < event.seq) {
                  state.reads.set(event.user_id, { seq: event.seq, username: event.username });
                  updateReceipts();
                }
              }
              break;
            default:
              break;
          }
        }

        function hideContacts() {
          els.app.classList.add("hide-contacts");
          fitInput();
        }

        function showContacts() {
          els.app.classList.remove("hide-contacts");
          fitInput();
        }

        function currentName() {
          return els.name.value.trim() || "Guest";
        }

        function saveIdentity() {
          storage.set("name", els.name.value.trim());
          storage.set("color", els.color.value);
        }

        function applyIdentity() {
          saveIdentity();
          send({ type: "hello", user_id: state.uid, username: currentName(), color: els.color.value });
        }

        function stopTyping() {
          clearTimeout(state.typingTimer);
          state.typingTimer = null;
          if (state.typingSent) {
            state.typingSent = 0;
            send({ type: "typing", user_id: state.uid, typing: false });
          }
        }

        function noteTyping() {
          if (!socketOpen()) {
            return;
          }
          const now = Date.now();
          if (now - state.typingSent >= TYPING_REFRESH) {
            if (send({ type: "typing", user_id: state.uid, typing: true })) {
              state.typingSent = now;
            }
          }
          clearTimeout(state.typingTimer);
          state.typingTimer = setTimeout(stopTyping, TYPING_IDLE);
        }

        function sendMessage() {
          const text = els.input.value.trim();
          if (!text || !send({ type: "message", user_id: state.uid, text })) {
            return;
          }
          stopTyping();
          els.input.value = "";
          fitInput();
          els.input.blur();
          try {
            document.activeElement?.blur();
          } catch {}
        }

        function sendAway(away) {
          send({ type: "away", user_id: state.uid, away });
        }

        function fitInput() {
          const field = els.input;
          if (field.value === "") {
            field.style.height = `${INPUT_MIN_HEIGHT}px`;
            field.style.overflowY = "hidden";
            return;
          }
          const style = getComputedStyle(field);
          const border = parseFloat(style.borderTopWidth) + parseFloat(style.borderBottomWidth);
          const max = parseFloat(style.maxHeight) || 132;
          field.style.height = "auto";
          const needed = field.scrollHeight + border;
          field.style.height = `${Math.min(needed, max)}px`;
          field.style.overflowY = needed > max ? "auto" : "hidden";
        }

        async function fetchConfig() {
          const response = await fetch("/config", { cache: "no-store" });
          if (!response.ok) {
            throw new Error(`config ${response.status}`);
          }
          const config = await response.json();
          if (!Number.isInteger(config.web_port)) {
            throw new Error("config without port");
          }
          state.cfg = config;
          els.version.textContent = config.version ? `v${config.version}` : "";
        }

        function socketUrl() {
          const secure = window.location.protocol === "https:";
          const host = window.location.host || `127.0.0.1:${state.cfg.web_port}`;
          return `${secure ? "wss" : "ws"}://${host}/ws?uid=${encodeURIComponent(state.uid)}`;
        }

        function scheduleReconnect() {
          if (state.reconnectTimer === null) {
            state.reconnectTimer = setTimeout(() => {
              state.reconnectTimer = null;
              connect();
            }, RECONNECT_DELAY);
          }
        }

        async function connect() {
          if (state.connecting || (state.ws !== null && state.ws.readyState <= WebSocket.OPEN)) {
            return;
          }
          state.connecting = true;
          try {
            await fetchConfig();
          } catch {
            state.connecting = false;
            scheduleReconnect();
            return;
          }

          let socket;
          try {
            socket = new WebSocket(socketUrl());
          } catch {
            state.connecting = false;
            scheduleReconnect();
            return;
          }
          socket.binaryType = "arraybuffer";
          state.ws = socket;
          state.channel = null;
          state.connecting = false;

          const secured = () => {
            state.users.clear();
            state.typing.clear();
            state.reads.clear();
            state.readSent = 0;
            renderPeople();
            updateStatus();
            applyIdentity();
            if (document.visibilityState === "hidden") {
              sendAway(true);
            }
          };

          socket.onmessage = (message) => {
            if (state.ws !== socket) {
              return;
            }
            if (typeof message.data === "string") {
              if (state.channel !== null) {
                socket.close();
                return;
              }
              try {
                const { channel, reply } = startChannel(JSON.parse(message.data));
                socket.send(JSON.stringify(reply));
                state.channel = channel;
              } catch {
                socket.close();
                return;
              }
              els.security.textContent = `Encrypted · ${state.channel.code}`;
              secured();
              return;
            }
            if (state.channel === null) {
              socket.close();
              return;
            }
            let event;
            try {
              event = unseal(state.channel, message.data);
            } catch {
              socket.close();
              return;
            }
            if (event && typeof event === "object") {
              handleEvent(event);
            }
          };

          socket.onclose = () => {
            if (state.ws !== socket) {
              return;
            }
            state.channel = null;
            els.security.textContent = "";
            state.settled = true;
            state.typingSent = 0;
            updateStatus();
            scheduleReconnect();
          };

          socket.onerror = () => {
            try {
              socket.close();
            } catch {}
          };
        }

        async function pollHealth() {
          if (state.healthBusy) {
            return;
          }
          state.healthBusy = true;
          try {
            const response = await fetch("/health", { cache: "no-store" });
            state.healthOk = response.ok;
          } catch {
            state.healthOk = false;
          } finally {
            state.healthBusy = false;
          }
          updateStatus();
          if (state.healthOk && els.icon.complete && els.icon.naturalWidth === 0) {
            els.icon.src = `/icon.svg?retry=${Date.now()}`;
          }
          if (state.healthOk && (state.ws === null || state.ws.readyState > WebSocket.OPEN)) {
            connect();
          }
          if (expireTyping()) {
            renderPeople();
          }
        }

        function sizeApp() {
          const viewport = window.visualViewport;
          const width = viewport ? viewport.width : window.innerWidth;
          const height = viewport ? viewport.height : window.innerHeight;
          const top = viewport ? viewport.offsetTop : 0;
          const left = viewport ? viewport.offsetLeft : 0;
          const appWidth = Math.floor(width * 0.95);
          const gap = Math.round(height * 0.025);
          const appHeight = Math.max(0, Math.floor(height - gap * 2));
          els.app.style.width = `${appWidth}px`;
          els.app.style.height = `${appHeight}px`;
          els.app.style.left = `${Math.round(left + (width - appWidth) / 2)}px`;
          els.app.style.top = `${Math.round(top + gap)}px`;
          if (window.scrollY || window.scrollX) {
            window.scrollTo(0, 0);
          }
        }

        function blockZoom() {
          const block = (event) => {
            if (event.cancelable) {
              event.preventDefault();
            }
          };
          for (const type of ["gesturestart", "gesturechange", "gestureend"]) {
            document.addEventListener(type, block, { passive: false });
          }
          document.addEventListener(
            "touchmove",
            (event) => {
              if (event.touches.length > 1 || (typeof event.scale === "number" && event.scale !== 1)) {
                block(event);
              }
            },
            { passive: false },
          );
          window.addEventListener(
            "wheel",
            (event) => {
              if (event.ctrlKey || event.metaKey) {
                block(event);
              }
            },
            { passive: false },
          );
          window.addEventListener("keydown", (event) => {
            if ((event.ctrlKey || event.metaKey) && ZOOM_KEYS.has(event.key)) {
              block(event);
            }
          });
        }

        function wireEvents() {
          els.toggleContacts.addEventListener("click", hideContacts);
          els.toggleContactsMain.addEventListener("click", showContacts);

          els.apply.addEventListener("click", () => {
            applyIdentity();
            hideContacts();
          });
          els.name.addEventListener("keydown", (event) => {
            if (event.key === "Enter" && !event.isComposing) {
              event.preventDefault();
              applyIdentity();
              hideContacts();
            }
          });

          els.send.addEventListener("click", sendMessage);
          els.input.addEventListener("keydown", (event) => {
            if (event.key === "Enter" && !event.shiftKey && !event.isComposing && event.keyCode !== 229) {
              event.preventDefault();
              sendMessage();
            }
          });
          els.input.addEventListener("input", () => {
            fitInput();
            if (els.input.value.trim()) {
              noteTyping();
            } else {
              stopTyping();
            }
          });

          document.addEventListener("visibilitychange", () => {
            const hidden = document.visibilityState === "hidden";
            sendAway(hidden);
            if (hidden) {
              stopTyping();
            } else {
              pollHealth();
              scheduleRead();
            }
          });
          window.addEventListener("pagehide", () => sendAway(true));
          window.addEventListener("pageshow", (event) => {
            if (event.persisted) {
              sendAway(false);
              pollHealth();
              scheduleRead();
            }
          });

          window.addEventListener(
            "resize",
            () => {
              sizeApp();
              fitInput();
              if (state.pinned) {
                pinFeed();
              }
            },
            { passive: true },
          );
          if (window.visualViewport) {
            window.visualViewport.addEventListener("resize", sizeApp);
            window.visualViewport.addEventListener("scroll", sizeApp);
          }
          document.addEventListener("focusin", sizeApp);
          document.addEventListener("focusout", () => {
            sizeApp();
            setTimeout(sizeApp, 300);
          });
        }

        function start() {
          els.name.value = storage.get("name") || "";
          els.color.value = safeColor(storage.get("color"));
          state.readObserver = createReadObserver();
          blockZoom();
          watchFeed();
          wireEvents();
          sizeApp();
          fitInput();
          pollHealth();
          setInterval(pollHealth, HEALTH_INTERVAL);
        }

        start();
      })();
    </script>
  </body>
</html>
